<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 动量轮动信号</title>
<style>
  :root { --bg:#faf9f6; --card:#ffffff; --text:#1a1a1a; --muted:#777; --red:#d33; --green:#1a7f37; --blue:#185fa5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:24px; }
  .wrap { max-width: 960px; margin:0 auto; }
  h1 { font-size:22px; font-weight:600; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .latest { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .latest .action { font-size:28px; font-weight:700; }
  .buy { color:var(--red); }
  .hold { color:var(--green); }
  .switch { color:#b8860b; }
  .tag { font-size:13px; color:var(--muted); }
  .big { font-size:20px; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid #eee; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  tr.top td:first-child::before { content:"● "; color:var(--red); }
  .pos { color:var(--red); }
  .neg { color:var(--green); }
  .muted { color:var(--muted); }
  @media (max-width:600px){ body{padding:12px;} .latest .action{font-size:22px;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>ETF 动量轮动信号</h1>
  <div class="sub">每天 13:59 自动计算 · 黄金 / 纳指 / 创业板 / 上证180 · 年化收益 × R² 动量打分</div>

  <div class="card">
    <div class="latest">
      <span id="latest-action" class="action">--</span>
      <span id="latest-name" class="big">--</span>
      <span id="latest-price" class="tag">--</span>
    </div>
    <div class="sub" id="latest-date" style="margin-top:8px;margin-bottom:0;">--</div>
  </div>

  <div class="card">
    <h2 style="font-size:15px;margin-bottom:12px;">最新排名</h2>
    <table>
      <thead><tr><th>名称</th><th>代码</th><th>价格</th><th>动量得分</th><th>年化收益</th><th>R²</th></tr></thead>
      <tbody id="rank-body"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2 style="font-size:15px;margin-bottom:12px;">历史操作</h2>
    <table>
      <thead><tr><th>日期</th><th>操作</th><th>持仓</th><th>价格</th><th>得分</th></tr></thead>
      <tbody id="history-body"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
    </table>
  </div>

  <div class="sub" style="text-align:center;margin-top:16px;">数据仅供研究参考，不构成投资建议</div>
</div>

<script>
fetch('data/信号历史.json')
  .then(r => r.json())
  .then(history => {
    if (!history.length) return;
    const latest = history[history.length - 1];

    // 操作标签与颜色
    const actionMap = { '买入':'buy', '持有':'hold', '换仓':'switch', '无信号':'' };
    const elA = document.getElementById('latest-action');
    elA.textContent = latest.操作;
    elA.className = 'action ' + (actionMap[latest.操作] || '');
    document.getElementById('latest-name').textContent = latest.持仓名称 || '--';
    document.getElementById('latest-price').textContent = latest.价格 ? ('价格 ' + latest.价格) : '';
    document.getElementById('latest-date').textContent = '更新于 ' + latest.日期 + ' ' + latest.时间;

    // 最新排名
    const rankBody = document.getElementById('rank-body');
    rankBody.innerHTML = '';
    (latest.排名 || []).forEach((r, i) => {
      const scoreCls = (r.动量得分 ?? 0) >= 0 ? 'pos' : 'neg';
      const tr = document.createElement('tr');
      if (i === 0) tr.className = 'top';
      tr.innerHTML = `<td>${r.名称}</td><td class="muted">${r.代码}</td><td>${r.价格 ?? '--'}</td>` +
        `<td class="${scoreCls}">${r.动量得分 ?? '--'}</td><td>${r.年化收益 ?? '--'}</td><td>${r.R2 ?? '--'}</td>`;
      rankBody.appendChild(tr);
    });

    // 历史操作（倒序，最新在上）
    const histBody = document.getElementById('history-body');
    histBody.innerHTML = '';
    [...history].reverse().forEach(h => {
      const tr = document.createElement('tr');
      const cls = actionMap[h.操作] || '';
      tr.innerHTML = `<td>${h.日期}</td><td class="${cls}">${h.操作}</td>` +
        `<td>${h.持仓名称 || '--'}</td><td>${h.价格 ?? '--'}</td><td>${h.动量得分 ?? '--'}</td>`;
      histBody.appendChild(tr);
    });
  })
  .catch(e => {
    document.getElementById('rank-body').innerHTML = '<tr><td colspan="6" class="muted">数据加载失败</td></tr>';
    document.getElementById('history-body').innerHTML = '<tr><td colspan="5" class="muted">数据加载失败</td></tr>';
  });
</script>
</body>
</html>
